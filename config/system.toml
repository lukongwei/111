# AI Workspace Phase 1 配置。
# Index 数据库存放在 Workspace 中央数据目录；Agent 仍须等待 Gateway 才能访问 Index。

[workspace]
name = "AI Workspace"
phase = 1

[paths]
projects = "PROJECTS"
logs = "LOGS"
tasks = "TASKS"
index_database = "DASHBOARD/data/index.sqlite3"

[runtime]
allow_direct_filesystem_access = false
gateway_required = true

