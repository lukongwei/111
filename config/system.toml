# AI Workspace MVP 配置。
# Index 数据库存放在 Workspace 中央数据目录；Agent 必须通过 Gateway 获取信息。

[workspace]
name = "AI Workspace"
phase = 10

[paths]
projects = "PROJECTS"
logs = "LOGS"
tasks = "TASKS"
index_database = "DASHBOARD/data/index.sqlite3"

[runtime]
allow_direct_filesystem_access = false
gateway_required = true

